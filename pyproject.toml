[project]
name = "iris"
version = "0.2.0"
description = "Iris, assistente pessoal de voz com memoria que aprende"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pywebview>=5.3",
    "pydantic-settings>=2.4",
    "vosk>=0.3.45",
    "sounddevice>=0.5",
    "anthropic>=0.40",
    "claude-agent-sdk>=0.2",
    "keyring>=25",
    "pyttsx3>=2.98",
    "edge-tts>=7.0",
    "miniaudio>=1.60",
    "faster-whisper>=1.1",
    "PySide6>=6.7",
    "qtpy>=2.4",
    "send2trash>=1.8",
    "mss>=9.0",
    "pillow>=10.0",
    "ddgs>=9.0",
    "trafilatura>=2.0",
    "pypdf>=5.0",
    "uiautomation>=2.0",
    "fastembed>=0.7",
    "sqlite-vec>=0.1.6",
    "numpy>=1.26",
    "textual>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]
build = ["pyinstaller>=6.10"]

[project.scripts]
iris = "iris.cli:main"

[project.gui-scripts]
iris-desktop = "iris.app:main"
iris-listener = "iris.listener:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iris = ["agent/prompts/*.md", "ui/web/**/*", "ui/assets/*", "tui/*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
